<header class="topbar" id="top">
  <a class="brand" [routerLink]="isAdmin ? '/admin/courses' : '/courses'">Course Learning Platform</a>
  <nav class="main-nav" aria-label="Main navigation">
    <a *ngIf="isAdmin" routerLink="/admin/users" routerLinkActive="active" ariaCurrentWhenActive="page">Users</a>
    <a *ngIf="isAdmin" routerLink="/admin/courses" routerLinkActive="active" ariaCurrentWhenActive="page">Courses</a>
    <a *ngIf="session && !isAdmin" routerLink="/courses" routerLinkActive="active" ariaCurrentWhenActive="page">Courses</a>
    <a *ngIf="session && !isAdmin" routerLink="/my-courses" routerLinkActive="active" ariaCurrentWhenActive="page">My courses</a>
    <a *ngIf="session && !isAdmin" routerLink="/my-analytics" routerLinkActive="active" ariaCurrentWhenActive="page">My analytics</a>
    <a *ngIf="!session" routerLink="/courses" routerLinkActive="active" ariaCurrentWhenActive="page">Courses</a>
  </nav>
  <div class="session" *ngIf="session; else signedOut">
    <span class="welcome">{{ session.name }} <span class="role">{{ session.role }}</span></span>
    <button class="secondary" type="button" (click)="signOut()">Sign out</button>
  </div>
  <ng-template #signedOut><a class="sign-in-link" routerLink="/account">Sign in</a></ng-template>
</header>
<main><router-outlet></router-outlet></main>
